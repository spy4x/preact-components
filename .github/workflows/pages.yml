name: Pages

# GitHub Pages can only be deployed by a GitHub workflow — Woodpecker cannot reach it. The
# repository's normal CI stays in `.woodpecker.yml`; this file exists for the deploy alone.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: Pages needs to write the deployment and mint an OIDC token for it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-published artefact is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - uses: actions/configure-pages@v5

      # `deno task check` runs in Woodpecker on every push; this job only has to prove that the
      # artefact builds, and the build type-checks the catalogue itself before emitting anything.
      - name: Build the demo
        run: deno task --cwd pages build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
