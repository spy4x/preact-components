name: Pages

# Deploys `main` to GitHub Pages, and does nothing else. Every check, the browser run included,
# lives in Woodpecker (`.woodpecker.yml`); GitHub Pages can only be deployed by a GitHub workflow,
# which is why this file exists at all.
#
# The deploy waits for Woodpecker: Woodpecker posts a commit status when its push build of `main`
# ends, and that status event starts this workflow. Only a green `ci/woodpecker/push/woodpecker`
# status deploys, so a red check, build or browser part never reaches the site. A `status` event
# runs the workflow file from `main`, whatever commit the status is for.
on:
  status:

# A deploy in flight is never cancelled: a half-published artefact is worse than a slightly stale
# one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.context == 'ci/woodpecker/push/woodpecker' &&
      github.event.state == 'success' &&
      contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Two green builds can finish out of order. Only the commit that is still the head of `main`
      # deploys, so an older build finishing late never replaces a newer site.
      - name: Check the commit is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${head}" = "${SHA}" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Skipped: ${SHA} is no longer the head of main (${head})"
          fi

      - if: steps.head.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.sha }}

      - if: steps.head.outputs.deploy == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - if: steps.head.outputs.deploy == 'true'
        name: Build the demo
        run: deno task --cwd pages build

      - if: steps.head.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/dist

      - if: steps.head.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - if: steps.head.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
