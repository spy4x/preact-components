name: Pages

# Two things live here, and the second is why this file is no longer deploy-only.
#
# GitHub Pages can only be deployed by a GitHub workflow — Woodpecker cannot reach it. Woodpecker
# still runs `deno task check` on the same pull-request and push events (and publishes on a `v*`
# tag, which this workflow ignores), but it runs it in `denoland/deno:2.9.7`, which
# has no browser, so it cannot run `pages/verify.ts`. That script is where every assertion about
# keyboard, focus and effects lives, because this repository's unit tests render to a string and can
# see none of it. GitHub's `ubuntu-latest` image ships Google Chrome, which `verify.ts` already
# looks for by name, so the browser phase runs here and nowhere else.
#
# The deploy therefore waits for all three: a red `check`, a red build or a red `verify` blocks the
# publish.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A deploy in flight is never cancelled — a half-published artefact is worse than a slightly stale
# one — so deploys keep the one non-cancelling `pages` group. Pull-request runs get a group of their
# own, per ref, and do cancel: queueing a review run behind a deploy would make this the slowest
# check on the pull request, and a superseded commit's run is of no interest.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # `pages/verify.ts` now bounds its own browser phase (`#239`), but this is the backstop for
    # everything outside that phase — the build, the static phase, a hung `deno task check` — so a
    # runner that wedges still frees itself well inside the platform's own default rather than
    # waiting out a six-hour job timeout. 15 minutes is generous against the run this workflow
    # actually does today: `check` and the build together take a small fraction of that, and
    # `verify`'s own worst case is its 5-minute phase deadline plus the two bounded launch attempts
    # ahead of it.
    timeout-minutes: 15
    # Least privilege: this job reads the repository and nothing else. Writing the deployment and
    # minting its OIDC token belong to the deploy job below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      # Printed so a runner image that stopped shipping Chrome is one line in the log rather than a
      # puzzle further down. `verify` fails on a missing browser either way.
      - name: Report the browser the verify step will drive
        run: google-chrome --version

      - name: Check
        run: deno task check

      # Not part of `deno task check` — see the task's own comment in `deno.jsonc` for why — so it
      # is a step of its own. The checkout is clean here, unlike a workstation mid-change, so this
      # runs the bare task rather than `--allow-dirty`; a missing return type or a `theme/`-style CSS
      # export fails this step the same way a red `check` does, before the build or the deploy.
      - name: Dry-run the JSR publish
        run: deno task publish:dry

      - name: Build the demo
        run: deno task --cwd pages build

      # `CHROME_PATH` pins the browser to the one whose version was just printed. Without it
      # `verify.ts` walks its candidate list and this runner answers `chromium-browser` first, so
      # the log reported one browser and drove another. Naming it also makes a runner image that
      # dropped Chrome fail here, loudly, instead of quietly running something else.
      - name: Verify the demo in a real browser
        run: deno task --cwd pages verify
        env:
          CHROME_PATH: google-chrome

      # Pages artefacts are for the deploy alone: a pull request neither publishes nor needs one.
      - name: Upload the Pages artefact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/dist

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The two write permissions exist only here, in the one job that publishes.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Kept, and moved out of the build job: it is the step that needs `pages: write`, and the
      # build never read its outputs — the demo's base path is a constant in `pages/src/site.ts`.
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
