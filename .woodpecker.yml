# Triggers are declared rather than inferred: without a `when` block Woodpecker
# falls back to a default it reports as a `bad_habit` warning, and that default
# runs the pipeline on every event type.
#
# `branch` is checked against the *target* branch of a pull request, so this
# still runs on every PR into `main` — from a fork or a feature branch — and on
# a push to `main` itself. A `v*` tag gets its own entry, because a tag build has
# no branch to match `main` against: it runs the same checks and then publishes to
# JSR. Releases and PR-metadata edits are excluded: `pull_request_metadata` fires
# on a title or label edit, which cannot change a check result.
when:
  - event: [push, pull_request]
    branch: main
  - event: tag
    ref: refs/tags/v*

steps:
  check:
    image: denoland/deno:2.9.7
    commands:
      - deno task check

  # Not part of `deno task check` — see that task's own comment in `deno.jsonc` — so it runs as its
  # own step. The checkout here is clean, so the bare task is enough; a missing return type or a
  # CSS-module export fails this step the same way a red `check` fails the one above.
  publish-dry:
    image: denoland/deno:2.9.7
    depends_on: [check]
    commands:
      - deno task publish:dry

  # The browser checks (`pages/README.md`, "Running a full run in parts"). They run in Playwright's
  # image, which carries Chromium and its system libraries; its tag matches the `playwright-core`
  # pin in `pages/deno.json`. The image has no Deno, so this step installs one pinned release,
  # checked against the checksum published beside it
  # (`deno-x86_64-unknown-linux-gnu.zip.sha256sum`), into `/woodpecker`: every step of the
  # pipeline shares that folder, and it lies outside the checkout. Change the version and the
  # checksum together. Not on a tag: a tag is on `main`, whose push build already ran these.
  pages-build:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when:
      event: [push, pull_request]
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - |
          curl -fsSL -o /woodpecker/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /woodpecker/deno.zip" | sha256sum -c -
          python3 -m zipfile -e /woodpecker/deno.zip /woodpecker/bin
          chmod +x /woodpecker/bin/deno
      - export PATH="/woodpecker/bin:$${PATH}"
      - deno --version
      - deno task --cwd pages build
    depends_on: [check]

  # The parts run in two lanes side by side, three parts each, balanced by their usual time:
  # `verify-ui`, `verify-e2e-2`, `verify-e2e-4` and `verify-e2e-1`, `verify-e2e-3`, `verify-rest`.
  # Two lanes, not six: each part already drives four browser contexts, and the agent host runs
  # other pipelines too, so more browsers at once would push the heavy checks past their limits
  # (#1052). In one lane the six parts took about 22 minutes; two lanes take about half.
  # `e2e` runs as four shards (#975): as one step it ran past its 900-second ceiling whenever other
  # pipelines shared the agent. `pages/e2e/shard.test.ts` fails when a shard is missing here or
  # listed twice. A red part skips the parts after it in its lane. `CHROME_PATH` names the image's
  # Chromium, so the browser `verify` drives is the one it reports.
  verify-ui:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when:
      event: [push, pull_request]
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --only=ui
    depends_on: [pages-build]

  verify-e2e-1:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when:
      event: [push, pull_request]
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --only=e2e --e2e-shard=1/4
    depends_on: [pages-build]

  verify-e2e-2:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when:
      event: [push, pull_request]
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --only=e2e --e2e-shard=2/4
    depends_on: [verify-ui]

  verify-e2e-3:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when:
      event: [push, pull_request]
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --only=e2e --e2e-shard=3/4
    depends_on: [verify-e2e-1]

  verify-e2e-4:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when:
      event: [push, pull_request]
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --only=e2e --e2e-shard=4/4
    depends_on: [verify-e2e-2]

  verify-rest:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when:
      event: [push, pull_request]
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --except=ui,e2e
    depends_on: [verify-e2e-3]

  # Guards against an accidental release: a `v*` tag publishes to JSR with the global token, so
  # this step fails the build unless the tagged commit is already on `main` (reviewed, green CI).
  # It is not access control: Woodpecker runs the tagged commit's own `.woodpecker.yml`, so a tag
  # on a branch that predates this step, or one that removes it, still publishes. A tag build's
  # clone is full but has no `main` ref, which is why the step fetches it.
  on-main:
    image: alpine/git:2.47.2
    depends_on: [publish-dry]
    when:
      event: tag
      ref: refs/tags/v*
    commands:
      - git fetch --no-tags --depth=2147483647 origin main
      - git merge-base --is-ancestor "$${CI_COMMIT_SHA}" FETCH_HEAD || { echo "Refusing to publish, commit $${CI_COMMIT_SHA} is not on main"; exit 1; }

  # Publishes every named workspace member to JSR (`jsr:@spy4x/preact-*`), only on a `v*` tag
  # and only after both steps above passed. `docs/publishing.md` has the release steps. JSR never
  # deletes a version, and a version already on JSR is skipped, so re-running a tag build that
  # failed part-way publishes only what is missing. `$$` stops Woodpecker substituting the variable
  # itself; the shell reads the secret.
  publish:
    image: denoland/deno:2.9.7
    depends_on: [on-main]
    when:
      event: tag
      ref: refs/tags/v*
    environment:
      JSR_TOKEN:
        from_secret: JSR_TOKEN
    commands:
      # `deno publish` exits 0 when every version is already on JSR, so a tag pushed without the
      # version bump would go green and publish nothing; this refuses any tag that is not `v` plus
      # the one version every package declares.
      - deno run --allow-read --allow-env=CI_COMMIT_TAG infra/scripts/release-tag.ts
      # A stalled upload is retried (#868): each attempt gets 10 minutes, and a version already
      # on JSR is skipped, so a retry publishes only what is missing. Each attempt logs its start,
      # end and exit code, so a stall shows whether the time went to the upload or to JSR.
      - |
          for attempt in 1 2 3; do
            echo "publish attempt $${attempt} started $$(date -u +%H:%M:%S)"
            rc=0
            timeout 600 deno publish --token "$${JSR_TOKEN}" || rc=$$?
            echo "publish attempt $${attempt} ended $$(date -u +%H:%M:%S), exit code $${rc}"
            if [ "$${rc}" -eq 0 ]; then exit 0; fi
          done
          exit 1
