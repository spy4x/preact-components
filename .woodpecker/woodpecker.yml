# Triggers are declared rather than inferred: without a `when` block Woodpecker
# falls back to a default it reports as a `bad_habit` warning, and that default
# runs the pipeline on every event type.
#
# `branch` is checked against the *target* branch of a pull request, so this
# still runs on every PR into `main` — from a fork or a feature branch — and on
# a push to `main` itself. A `v*` tag gets its own entry, because a tag build has
# no branch to match `main` against: it runs the same checks and then publishes to
# JSR. Releases are excluded.
#
# A pull request whose title starts with `[WIP]` runs `wip.yml` (only `check`) instead of this
# workflow, so a draft's pushes cost one quick step. Branch protection requires this workflow's
# context, `ci/woodpecker/pr/woodpecker`, so a `[WIP]` head cannot merge. Removing `[WIP]` from
# the title is a `pull_request_metadata` event with reason `edited` (Woodpecker sets
# `CI_COMMIT_MESSAGE` to the title on pull request events), and it starts this workflow without a
# new push. Other metadata events (labels, review requests) run nothing. Every step condition that
# names `pull_request` also names `pull_request_metadata`, or a title-edit run would skip it and
# still report green. The `[WIP]` conditions here are the exact negation of `wip.yml`'s, which
# `infra/scripts/woodpecker-wip.test.ts` checks.
when:
  - event: push
    branch: main
  - event: pull_request
    branch: main
    evaluate: 'not (CI_COMMIT_MESSAGE startsWith "[WIP]")'
  # `CI_PIPELINE_EVENT_REASON` joins the reasons with commas; GitHub sends one per event.
  - event: pull_request_metadata
    branch: main
    evaluate: 'CI_PIPELINE_EVENT_REASON contains "edited" && not (CI_COMMIT_MESSAGE startsWith "[WIP]")'
  - event: tag
    ref: refs/tags/v*
  # The nightly run on `main`: a Woodpecker cron named `nightly`, created once in the repository's
  # settings ("Crons"). It runs every step but the publishing ones and pushes to ntfy when one fails.
  - event: cron
    cron: nightly

# The browser steps (`pages-build` and the six `verify-*`) run on a ready pull request and on the
# nightly run, never on a push to `main`: the same commit's pull request already ran them, and a red
# step after the merge stops nothing. The nightly run still catches a break that shows only on
# `main` within a day. A pull request that changes only Markdown skips them too; `check` and
# `publish-dry` still run, so the workflow still reports its status. A pull request whose changed
# files Woodpecker does not know runs them.
variables:
  - &browser_when
    - event: [pull_request, pull_request_metadata]
      path:
        exclude: ["*.md", "**/*.md"]
    - event: cron
      cron: nightly

steps:
  check:
    image: denoland/deno:2.9.7
    commands:
      - deno task check

  # Not part of `deno task check` — see that task's own comment in `deno.jsonc` — so it runs as its
  # own step. The checkout here is clean, so the bare task is enough; a missing return type or a
  # CSS-module export fails this step the same way a red `check` fails the one above.
  publish-dry:
    image: denoland/deno:2.9.7
    depends_on: [check]
    commands:
      - deno task publish:dry

  # The browser checks (`pages/README.md`, "Running a full run in parts"). They run in Playwright's
  # image, which carries Chromium and its system libraries; its tag matches the `playwright-core`
  # pin in `pages/deno.json`. The image has no Deno, so this step installs one pinned release,
  # checked against the checksum published beside it
  # (`deno-x86_64-unknown-linux-gnu.zip.sha256sum`), into `/woodpecker`: every step of the
  # pipeline shares that folder, and it lies outside the checkout. Change the version and the
  # checksum together. Not on a tag: a tag is on `main`, whose pull request already ran these.
  pages-build:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when: *browser_when
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /woodpecker/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /woodpecker/deno.zip" | sha256sum -c -
          python3 -m zipfile -e /woodpecker/deno.zip /woodpecker/bin
          chmod +x /woodpecker/bin/deno
      - export PATH="/woodpecker/bin:$${PATH}"
      - deno --version
      - deno task --cwd pages build
    depends_on: [check]

  # The parts run two at a time, in three pairs balanced by their usual time: `verify-ui` with
  # `verify-rest`, then `verify-e2e-1` with `verify-e2e-2`, then `verify-e2e-3` with
  # `verify-e2e-4`. Woodpecker runs `depends_on` as levels: a pair starts only once the whole pair
  # before it has finished, and a red part skips every later pair. Two at a time, not six: each
  # part already drives four browser contexts, and the agent host runs other pipelines too, so
  # more browsers at once push the heavy checks past their limits (#1052).
  # `e2e` runs as four shards (#975): as one step it ran past its 900-second ceiling whenever other
  # pipelines shared the agent. `pages/e2e/shard.test.ts` fails when a shard is missing here or
  # listed twice. `CHROME_PATH` names the image's Chromium, so the browser `verify` drives is the
  # one it reports.
  verify-ui:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when: *browser_when
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --only=ui
    depends_on: [pages-build]

  verify-e2e-1:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when: *browser_when
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --only=e2e --e2e-shard=1/4
    depends_on: [verify-ui, verify-rest]

  verify-e2e-2:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when: *browser_when
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --only=e2e --e2e-shard=2/4
    depends_on: [verify-ui, verify-rest]

  verify-e2e-3:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when: *browser_when
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --only=e2e --e2e-shard=3/4
    depends_on: [verify-e2e-1, verify-e2e-2]

  verify-e2e-4:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when: *browser_when
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --only=e2e --e2e-shard=4/4
    depends_on: [verify-e2e-1, verify-e2e-2]

  verify-rest:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    when: *browser_when
    environment:
      DENO_DIR: /woodpecker/deno-dir
    commands:
      - export PATH="/woodpecker/bin:$${PATH}" CHROME_PATH="$$(echo /ms-playwright/chromium-*/chrome-linux64/chrome)"
      - deno task --cwd pages verify --except=ui,e2e
    depends_on: [pages-build]

  # A red nightly run blocks nothing, so this pushes the pipeline's link to ntfy instead. It runs
  # only on the nightly cron and only when an earlier step failed; a skipped step still counts as
  # finished for `depends_on`. The repository's `ntfy_url`, `ntfy_topic` and `ntfy_token` secrets must
  # allow the `cron` event. `$$` stops Woodpecker substituting the variables itself.
  notify-nightly:
    image: denoland/deno:2.9.7@sha256:fa335acdf6b72106eda2cb6a8cb5f4187e7630e357467489db4b2e7352d5e432
    depends_on: [publish-dry, verify-e2e-3, verify-e2e-4]
    when:
      event: cron
      cron: nightly
      status: [failure]
    environment:
      NTFY_URL:
        from_secret: ntfy_url
      NTFY_TOPIC:
        from_secret: ntfy_topic
      NTFY_TOKEN:
        from_secret: ntfy_token
    commands:
      - >-
          deno eval 'const e = (k) => Deno.env.get(k);
          const r = await fetch(e("NTFY_URL").replace(/[/]$$/, "") + "/" + e("NTFY_TOPIC"),
          { method: "POST", headers: { Title: "preact-components: nightly CI failed", Authorization: "Bearer " + e("NTFY_TOKEN") },
          body: e("CI_PIPELINE_URL") });
          if (!r.ok) throw new Error(r.status + " " + r.statusText)'

  # Guards against an accidental release: a `v*` tag publishes to JSR with the global token, so
  # this step fails the build unless the tagged commit is already on `main` (reviewed, green CI).
  # It is not access control: Woodpecker runs the tagged commit's own `.woodpecker/` workflows, so
  # a tag on a branch that predates this step, or one that removes it, still publishes. A tag build's
  # clone is full but has no `main` ref, which is why the step fetches it.
  on-main:
    image: alpine/git:2.47.2
    depends_on: [publish-dry]
    when:
      event: tag
      ref: refs/tags/v*
    commands:
      - git fetch --no-tags --depth=2147483647 origin main
      - git merge-base --is-ancestor "$${CI_COMMIT_SHA}" FETCH_HEAD || { echo "Refusing to publish, commit $${CI_COMMIT_SHA} is not on main"; exit 1; }

  # Publishes every named workspace member to JSR (`jsr:@spy4x/preact-*`), only on a `v*` tag
  # and only after both steps above passed. `docs/publishing.md` has the release steps. JSR never
  # deletes a version, and a version already on JSR is skipped, so re-running a tag build that
  # failed part-way publishes only what is missing. `$$` stops Woodpecker substituting the variable
  # itself; the shell reads the secret.
  publish:
    image: denoland/deno:2.9.7
    depends_on: [on-main]
    when:
      event: tag
      ref: refs/tags/v*
    environment:
      JSR_TOKEN:
        from_secret: JSR_TOKEN
    commands:
      # `deno publish` exits 0 when every version is already on JSR, so a tag pushed without the
      # version bump would go green and publish nothing; this refuses any tag that is not `v` plus
      # the one version every package declares.
      - deno run --allow-read --allow-env=CI_COMMIT_TAG infra/scripts/release-tag.ts
      # A stalled upload is retried (#868): each attempt gets 10 minutes, then SIGTERM, then SIGKILL
      # 30 seconds later if it ignores that (#841), and a version already on JSR is skipped, so a
      # retry publishes only what is missing. Each attempt logs its start, end and exit code, so a
      # stall shows whether the time went to the upload or to JSR. The loop's `exit 0` ends the
      # whole step script, so nothing may be added after the loop: it would never run.
      - |
          for attempt in 1 2 3; do
            echo "publish attempt $${attempt} started $$(date -u +%H:%M:%S)"
            rc=0
            timeout -k 30 600 deno publish --token "$${JSR_TOKEN}" || rc=$$?
            echo "publish attempt $${attempt} ended $$(date -u +%H:%M:%S), exit code $${rc}"
            if [ "$${rc}" -eq 0 ]; then exit 0; fi
          done
          exit 1
